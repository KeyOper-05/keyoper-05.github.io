  if(stage.width!==w||stage.height!==h){stage.width=w;stage.height=h}
  if(!glState){
    const gl=stage.getContext('webgl',{antialias:true,preserveDrawingBuffer:true});
    if(!gl){$('viewNote').textContent='当前浏览器不支持 WebGL；请使用 Blender 场景或视频预览。';return}
    const shader=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s};
    const program=gl.createProgram();
    gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec4 position;attribute vec3 color;varying vec3 rgb;void main(){gl_Position=position;rgb=color;}'));
    gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 rgb;void main(){gl_FragColor=vec4(rgb,1.0);}'));
    gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
    glState={gl,program,buffer:gl.createBuffer(),position:gl.getAttribLocation(program,'position'),color:gl.getAttribLocation(program,'color')};
  }
  const {gl,program,buffer,position,color}=glState;
  gl.viewport(0,0,w,h);gl.clearColor(.067,.106,.145,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.useProgram(program);
  const target=mode==='camera'?f.camera.target:[6,3,0],eye=mode==='camera'?f.camera.pos:[6+zoom*Math.cos(azimuth)*Math.cos(elevation),3+zoom*Math.sin(azimuth)*Math.cos(elevation),zoom*Math.sin(elevation)];
  const forward=norm(sub(target,eye)),right=norm(cross(forward,[0,0,1])),up=cross(right,forward),focal=1/Math.tan((mode==='camera'?96:48)*Math.PI/360),near=.05,far=100;
  const vertices=[];
  for(const o of objects(f)){
    const verts=[];
    for(const z of [-1,1])for(const y of [-1,1])for(const x of [-1,1]){
      const xx=x*o.size[0]/2,rawY=y*o.size[1]/2,rawZ=z*o.size[2]/2,roll=o.roll||0,yy=rawY*Math.cos(roll)-rawZ*Math.sin(roll),zz=rawY*Math.sin(roll)+rawZ*Math.cos(roll);
      const p=[o.pos[0]+xx*Math.cos(o.yaw)-yy*Math.sin(o.yaw),o.pos[1]+xx*Math.sin(o.yaw)+yy*Math.cos(o.yaw),o.pos[2]+zz];
      const v=sub(p,eye),cz=dot(v,forward);
      verts.push([dot(v,right)*focal,dot(v,up)*focal*w/h,(far+near)/(far-near)*cz-2*far*near/(far-near),cz]);
    }
    const rgb=o.color.match(/\w\w/g).map(v=>parseInt(v,16)/255);
    [[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]].forEach((ids,j)=>{
      const shade=[.48,1,.8,.68,.73,.88][j];
      for(const k of [0,1,2,0,2,3])vertices.push(...verts[ids[k]],...rgb.map(v=>v*shade));
    });
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,4,gl.FLOAT,false,28,0);
  gl.enableVertexAttribArray(color);gl.vertexAttribPointer(color,3,gl.FLOAT,false,28,16);
  gl.drawArrays(gl.TRIANGLES,0,vertices.length/7);
}

function drawMap(f){let [ctx,w,h]=fit(map);ctx.clearRect(0,0,w,h);let scale=Math.min(w/20,h/14),ox=(w-18*scale)/2+3*scale,oy=h-((h-12*scale)/2+3*scale);let p=(x,y)=>[ox+x*scale,oy-y*scale];for(let r of DATA.story.rooms){let [x,y]=p(r.center[0]-3,r.center[1]+3);ctx.fillStyle=r.color+'33';ctx.fillRect(x,y,6*scale,6*scale);ctx.fillStyle='#dbe6ee';ctx.font=`${Math.max(11,w/39)}px system-ui`;ctx.textAlign='center';ctx.fillText(r.name,...p(r.center[0],r.center[1]+2.15))}ctx.strokeStyle='#92a2ae';ctx.lineWidth=2;for(let v of DATA.walls){if(v.pos[2]>2)continue;let a=p(v.pos[0]-v.size[0]/2,v.pos[1]+v.size[1]/2),b=p(v.pos[0]+v.size[0]/2,v.pos[1]-v.size[1]/2);ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1])}if($('paths').checked){DATA.story.actors.forEach((a,j)=>{ctx.beginPath();ctx.strokeStyle=a.color+'77';ctx.lineWidth=2;DATA.frames.forEach((v,i)=>{let q=p(...v.actors[j].pos);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke()})}for(let a of f.actors){let q=p(...a.pos);ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(...q,Math.max(5,scale*.26),0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=`${Math.max(11,w/40)}px system-ui`;ctx.fillText(a.id,q[0],q[1]+4)}let q=p(...f.camera.pos),target=p(...f.camera.target);ctx.strokeStyle='#ecf3f7';ctx.beginPath();ctx.moveTo(...q);ctx.lineTo(...target);ctx.stroke();ctx.fillStyle='#edf1f5';ctx.fillRect(q[0]-3,q[1]-3,6,6);let b=p(...f.book);ctx.fillStyle='#e9c24b';ctx.fillRect(b[0]-3,b[1]-3,6,6)}
function update(){let f=sample(time);draw3d(f);drawMap(f);$('clock').textContent=`${time.toFixed(1)} / 84.0 秒`;$('time').value=time;let ci=DATA.story.clips.findIndex(c=>time>=c[0]&&time<c[1]);if(ci<0)ci=DATA.story.clips.length-1;let clip=DATA.story.clips[ci];$('clipTitle').textContent=clip[2];$('clipPurpose').textContent=clip[3];$('bookState').textContent=time>=24?'由林 A 持有':time>=22?'取书进行中':'书房桌上';$('eventState').textContent=time>=24?'take_book · 已提交':'无';$('motionState').textContent=time>=34&&time<=40?'占位动作执行中':'占位 / 34–40 秒';$('actorsState').innerHTML=f.actors.map(a=>`<div class="row"><span>${a.name}</span><b>${rooms[f.state.actors[a.id].room]}</b></div>`).join('');[...$('chapters').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===ci)))}
DATA.story.clips.forEach(c=>{let b=document.createElement('button');b.textContent=`${c[0]}s ${c[2]}`;b.onclick=()=>{time=c[0];update()};$('chapters').append(b)});
$('play').onclick=()=>{if(time>=84)time=0;playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('time').oninput=e=>{time=+e.target.value;update()};$('paths').onchange=update;
for(let m of ['overview','camera'])$(m).onclick=()=>{mode=m;$(m).setAttribute('aria-pressed','true');$(m==='camera'?'overview':'camera').setAttribute('aria-pressed','false');$('viewLabel').textContent=m==='camera'?'CAM 01 · 全高墙体 / 连续镜头':'3D 世界 · 可拖动旋转';$('viewNote').textContent=m==='camera'?'相机与主角使用连续时间轴；画面未作剪辑。':'拖动旋转，滚轮缩放。总览降低墙高以显示室内；连续镜头使用完整墙体。';update()};
stage.onpointerdown=e=>{drag=[e.clientX,e.clientY];stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(!drag||mode!=='overview')return;azimuth-=(e.clientX-drag[0])*.008;elevation=Math.max(.25,Math.min(1.5,elevation+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];update()};stage.onpointerup=()=>drag=null;stage.onwheel=e=>{if(mode!=='overview')return;e.preventDefault();zoom=Math.max(17,Math.min(45,zoom+e.deltaY*.025));update()};new ResizeObserver(update).observe(stage);
function tick(now){if(playing&&last){time=Math.min(84,time+Math.min(.1,(now-last)/1000)*+$('speed').value);update();if(time>=84){playing=false;$('play').textContent='播放'}}last=now;requestAnimationFrame(tick)}update();requestAnimationFrame(tick);window.prototypeState=()=>({time,mode,frame:sample(time)});
</script></body></html>
